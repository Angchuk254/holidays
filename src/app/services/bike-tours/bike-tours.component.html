<section class="container py-5 service-page">
    <div class="row g-4 align-items-center">
        <div class="col-lg-6">
            <h1 class="fw-bold mb-3">Bike Tours</h1>
            <p class="lead text-muted">Guided and self-guided bike tours across the high-altitude routes of Ladakh and
                Spiti — we handle permits, bikes and support vehicles.</p>

            <h5 class="mt-4">Tour Types</h5>
            <div class="list-group mb-3">
                <div class="list-group-item" *ngFor="let t of tourTypes">
                    <div class="d-flex w-100 justify-content-between">
                        <h6 class="mb-1">{{ t.title }}</h6>
                        <small class="text-muted">{{ t.days }}</small>
                    </div>
                    <p class="mb-1 small text-muted">{{ t.details }}</p>
                </div>
            </div>

            <h5 class="mt-3">Safety & Support</h5>
            <ul>
                <li *ngFor="let s of safety">{{ s }}</li>
            </ul>

            <a routerLink="/contact" class="btn btn-brand mt-3">Book a Bike Tour</a>
        </div>

        <div class="col-lg-6">
            <img src="/assets/bike-world.jpeg" alt="Bike Tour" class="img-fluid rounded shadow-sm">
        </div>
    </div>
</section>

<section class="container py-5">
    <h4 class="section-title">Frequently Asked Questions</h4>
    <div class="accordion" id="bikeFaq">
        <div class="accordion-item mb-3" *ngFor="let f of faqs; let i = index">
            <h2 class="accordion-header" id="bikeFaqHeading{{i}}">
                <button class="accordion-button collapsed fw-bold text-brand" type="button" data-bs-toggle="collapse"
                    [attr.data-bs-target]="'#bikeFaq' + i" aria-expanded="false" [attr.aria-controls]="'bikeFaq' + i">{{
                    f.q }}</button>
            </h2>
            <div [id]="'bikeFaq' + i" class="accordion-collapse collapse" [attr.aria-labelledby]="'bikeFaqHeading' + i"
                data-bs-parent="#bikeFaq">
                <div class="accordion-body">{{ f.a }}</div>
            </div>
        </div>
    </div>
</section>
