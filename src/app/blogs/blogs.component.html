<section class="container py-5">
    <h2 class="fw-bold text-center mb-5">Latest Blogs</h2>
    <div class="row g-4">
        <div class="col-md-4" *ngFor="let blog of blogs">
            <div class="card h-100 shadow-sm">
                <img [src]="blog.image" class="card-img-top try" [alt]="blog.title">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ blog.title }}</h5>
                    <p class="card-text text-muted">{{ blog.shortDescription }}</p>
                    <a [routerLink]="['/blogs', blog.slug]" class="btn btn-brand mt-auto">Read More</a>
                </div>
            </div>
        </div>
    </div>
</section>
