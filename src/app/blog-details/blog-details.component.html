<section class="container py-5">
    <div class="row">
        <!-- Main Blog Content -->
        <div class="col-lg-8 mb-4">
            <h1 class="fw-bold mb-2">{{ blog?.title }}</h1>

            <div class="d-flex align-items-center mb-3 text-muted small">
                <div class="me-3">By <strong class="text-dark">{{ blog?.author || 'Golo Holidays' }}</strong></div>
                <div class="me-3">{{ blog?.date }}</div>
                <div class="me-3">{{ blog?.readTime }}</div>
                <div class="ms-auto">
                    <button class="btn btn-sm btn-outline-secondary me-2" (click)="copyLink()">
                        <i class="bi bi-link-45deg"></i> Share
                    </button>
                    <span *ngIf="showCopied" class="text-success small">Copied!</span>
                </div>
            </div>

            <div class="mb-3">
                <ng-container *ngFor="let t of blog?.tags">
                    <span class="badge bg-outline-brand me-1">{{ t }}</span>
                </ng-container>
            </div>

            <img [src]="blog?.image" class="img-fluid rounded mb-4" [alt]="blog?.title">

            <div *ngIf="blog?.highlights?.length" class="mb-4">
                <h5 class="section-title">Highlights</h5>
                <ul class="list-unstyled d-flex flex-wrap gap-2">
                    <li *ngFor="let h of blog?.highlights"
                        class="badge rounded-pill bg-light text-dark px-3 py-2 shadow-sm">{{ h }}</li>
                </ul>
            </div>

            <div class="blog-content mb-5" [innerHTML]="blog?.content"></div>
        </div>

        <!-- Sidebar: Recommended Blogs -->
        <div class="col-lg-4">
            <h5 class="fw-bold mb-3">Recommended Blogs</h5>
            <div class="list-group">
                <a *ngFor="let rec of recommendedBlogs" [routerLink]="['/blogs', rec.slug]"
                    class="list-group-item list-group-item-action">
                    <div class="d-flex">
                        <img [src]="rec.image" class="img-fluid rounded me-2"
                            style="width:60px; height:60px; object-fit:cover;">
                        <div>
                            <h6 class="mb-1">{{ rec.title }}</h6>
                            <small class="text-muted">{{ rec.date }}</small>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- Recommended Tours Section -->
    <div class="recommended-tours mt-5">
        <h3 class="fw-bold mb-4 text-center">Recommended Tours</h3>
        <div class="row g-4">
            <div class="col-md-4" *ngFor="let tour of recommendedTours">
                <div class="card h-100 shadow-sm">
                    <img [src]="tour.images" class="card-img-top" [alt]="tour.title">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ tour.title }}</h5>
                        <p class="card-text text-muted">{{ tour.shortDescription }}</p>
                        <a [routerLink]="['/packages', tour.slug]" class="btn btn-brand mt-auto">View Package</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<app-promo-popup></app-promo-popup>
