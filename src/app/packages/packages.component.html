<section class="container py-5">
    <h2 class="fw-bold text-center mb-5">Our Travel Packages</h2>
    <!-- Filter controls -->
    <div class="row mb-3">
        <div class="col-md-4">
            <label class="form-label small">Filter by region</label>
            <select class="form-select" [(ngModel)]="selectedRegion" (ngModelChange)="onFilterChange()">
                <option [ngValue]="null">All regions</option>
                <option *ngFor="let r of regions" [value]="r">{{ r }}</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label small">Filter by tour type</label>
            <select class="form-select" [(ngModel)]="selectedTourType" (ngModelChange)="onFilterChange()">
                <option [ngValue]="null">All types</option>
                <option *ngFor="let t of tourTypes" [value]="t">{{ t }}</option>
            </select>
        </div>
        <div class="col-md-4 d-flex align-items-end gap-2">
            <button class="btn btn-outline-brand" (click)="clearFilters()">Clear filters</button>
            <div class="text-muted small mt-2">{{ filteredPackages.length }} result(s)</div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-4" *ngFor="let tour of (filteredPackages.length ? filteredPackages : packages)">
            <div class="card h-100 shadow-sm">
                <img [src]="tour.images[0]" class="card-img-top" [alt]="tour.title">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ tour.title }}</h5>
                    <p class="card-text text-muted">{{ tour.shortDescription }}</p>
                    <p class="fw-bold mt-auto">Duration: {{ tour.duration }}</p>
                    <!-- <p class="fw-bold">Price: ₹{{ tour.price }}</p> -->
                    <a [routerLink]="['/packages', tour.slug]" class="btn btn-brand mt-2">View Details</a>
                </div>
            </div>
        </div>
    </div>
</section>
