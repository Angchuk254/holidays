<section class="container py-5">
    <h2 class="fw-bold text-center mb-5">Our Travel Packages</h2>
    <div class="row g-4">
        <div class="col-md-4" *ngFor="let tour of packages">
            <div class="card h-100 shadow-sm">
                <img [src]="tour.images[0]" class="card-img-top" [alt]="tour.title">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ tour.title }}</h5>
                    <p class="card-text text-muted">{{ tour.shortDescription }}</p>
                    <p class="fw-bold mt-auto">Duration: {{ tour.duration }}</p>
                    <!-- <p class="fw-bold">Price: ₹{{ tour.price }}</p> -->
                    <a [routerLink]="['/packages', tour.slug]" class="btn btn-brand mt-2">View Details</a>
                </div>
            </div>
        </div>
    </div>
</section>
