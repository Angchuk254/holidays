<section class="admin-login">
    <div class="login-card">
        <div class="brand">
            <div class="logo">Golo Holidays</div>
            <p>Admin Access</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" formControlName="email" placeholder="admin@email.com">
                <small class="text-danger" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
                    Enter a valid email.
                </small>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" formControlName="password" placeholder="••••••••">
                <small class="text-danger" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
                    Password must be at least 6 characters.
                </small>
            </div>

            <div class="alert alert-danger mt-3" *ngIf="error">{{ error }}</div>

            <button class="btn btn-brand w-100 mt-4" type="submit" [disabled]="loading">
                {{ loading ? 'Signing in...' : 'Login' }}
            </button>
        </form>

        <div class="helper">
            <a routerLink="/">Back to website</a>
        </div>
    </div>
</section>
